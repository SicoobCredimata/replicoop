[package]
name = "replicoop"
version = "1.0.0"
edition = "2021"
authors = ["Marcus Geraldino"]
description = "Sistema Profissional de Replicação MySQL em Rust"

[dependencies]
mysql = "25.0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1.0", features = ["full"] }
anyhow = "1.0"
thiserror = "2.0"
log = "0.4"
env_logger = "0.11"
colored = "2.1"
indicatif = "0.17"
flate2 = "1.0"
dialoguer = "0.11"
clap = { version = "4.5", features = ["derive"] }
